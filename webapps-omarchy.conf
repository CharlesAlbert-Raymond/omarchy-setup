# App launcher bindings (ALT + key)
#
# Lives in ~/supplements, sourced from overrides-omarchy.conf.
# Managed alongside install-webapps.sh, which installs the apps themselves.
#
# Number keys use `code:NN` instead of the digit, because with SHIFT held the
# keysym becomes `exclam`/`numbersign` and a plain `ALT SHIFT, 1` never fires.
#   code:10 = 1   code:11 = 2   code:12 = 3   code:13 = 4   code:14 = 5
#
# Most entries use omarchy-launch-or-focus, which focuses an existing window
# instead of opening a second copy. Its pattern is a case-insensitive regex
# matched against window class OR title, wrapped in word boundaries.

# Drop any prior claim on these combos (harmless when nothing is bound).
unbind = ALT, code:10
unbind = ALT, code:11
unbind = ALT, code:12
unbind = ALT, code:14
unbind = ALT, W
unbind = ALT SHIFT, code:10
unbind = ALT SHIFT, code:12
unbind = ALT SHIFT, A

# --- Native apps -----------------------------------------------------------
# Ghostty always opens a NEW window rather than focusing an existing one.
# Swap in omarchy-launch-or-focus com.mitchellh.ghostty "uwsm-app -- ghostty"
# to go back to focus-if-running.
bindd = ALT, code:10, Ghostty, exec, uwsm-app -- ghostty
# Chrome also always opens a NEW window. Swap in
# omarchy-launch-or-focus google-chrome "uwsm-app -- google-chrome-stable"
# to go back to focus-if-running.
bindd = ALT, code:11, Google Chrome, exec, uwsm-app -- google-chrome-stable --new-window
bindd = ALT, code:12, Slack, exec, omarchy-launch-or-focus Slack "uwsm-app -- slack"
bindd = ALT SHIFT, A, 1Password, exec, omarchy-launch-or-focus 1Password "uwsm-app -- 1password"
# Anchored to the native client's exact class. A loose "discord" pattern also
# matched the old Discord web app (chrome-discord.com__-Default) and any Chrome
# tab with Discord in its title, so it focused those instead of launching.
bindd = ALT SHIFT, code:12, Discord, exec, omarchy-launch-or-focus "^discord$" "uwsm-app -- discord"

# Claude Desktop launches without focus-matching: its window class is only
# known once installed, and a loose "Claude" pattern would also match a
# terminal running Claude Code. After installing, run
#   hyprctl clients | grep -i class | grep -i claude
# and switch this to omarchy-launch-or-focus <class> "uwsm-app -- claude-desktop"
bindd = ALT SHIFT, code:10, Claude Desktop, exec, uwsm-app -- claude-desktop

# --- Web apps --------------------------------------------------------------
# Patterns match the chrome --app window class (chrome-<domain>__-Default).
# Two gotchas, both verified the hard way:
#  - The trailing TLD is dropped on purpose. omarchy-launch-or-focus wraps the
#    pattern in \b...\b, and "...com" is followed by "_" (a word character),
#    so a pattern ending in .com never matches. Ending on ".apple" does.
#  - Don't match on the page title: some, like Apple Music, use a non-breaking
#    space, so a plain-space pattern silently never fires.
# Missive is pinned to the personal profile (Default) so it opens there no matter
# which Chrome profile was used last. Profile dirs: Default = personal,
# Profile 1 = Tedy, Profile 2 = geretaflotte -- check with
#   python3 -c 'import json;print(json.load(open("'"$HOME"'/.config/google-chrome/Local State"))["profile"]["info_cache"].keys())'
# Quote the value if the dir has a space (e.g. "Profile 1"): the launcher scripts
# rebuild the command as a string and eval it, so it would split into two words.
bindd = ALT, W, Missive, exec, omarchy-launch-or-focus-webapp chrome-mail.missiveapp "https://mail.missiveapp.com/##inbox" --profile-directory=Default
bindd = ALT, code:14, Apple Music, exec, omarchy-launch-or-focus-webapp chrome-music.apple "https://music.apple.com/"
