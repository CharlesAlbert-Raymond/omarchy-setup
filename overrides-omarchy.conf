# Personal Omarchy overrides
#
# Lives in ~/supplements and is symlinked to ~/.config/hypr/overrides.conf
# by install-overrides.sh. Edit THIS file, not the symlink.
#
# Sourced LAST from ~/.config/hypr/hyprland.conf, so anything here wins over
# both the Omarchy defaults (~/.local/share/omarchy/default/hypr/) and the
# per-topic user files (monitors.conf, looknfeel.conf, input.conf, ...).
#
# Keep customizations here so `omarchy update` and `omarchy refresh <app>`
# never clobber them. Validate after editing:
#   hyprctl reload && hyprctl configerrors

# --- Display scaling -------------------------------------------------------
# Catch-all: every monitor at 1.2x unless overridden by a named rule below.
# Hyprland silently rounds scales that aren't a multiple of 1/120 AND don't
# give a whole-pixel logical size. On the 1920x1200 laptop panel that rules
# out 1.15 (and 8/7); 1.2 (1600x1000 logical) is the nearest valid value,
# 1.25 (1536x960) the next step up.
monitor = , preferred, auto, 1.2

# GTK apps: keep GDK_SCALE in step with the compositor scale (Omarchy pairs
# 1 with 1, 1.6 with 1.75, 2 with 2).
# Only affects apps launched after a Hyprland restart / re-login.
env = GDK_SCALE,1

# Per-monitor exceptions. Named rules win over the catch-all above.
# External 4K: 1x is unreadable, 1.6 is Omarchy's 4K sweet spot.
# Positions are in logical (post-scale) pixels: DP-1 is 2400x1350, the
# laptop panel 1600x1000. Anchor the external at the origin and put the
# laptop directly below it, centered: x = (2400 - 1600) / 2 = 400, y = 1350.
monitor = DP-1, 3840x2160@60, 0x0, 1.6
monitor = eDP-1, 1920x1200@60, 400x1350, 1.2

# --- Removed Omarchy defaults ----------------------------------------------
# uninstall-defaults.sh removes these apps; drop their stock SUPER+SHIFT
# bindings so they don't sit dead in the keybindings menu. In order: Spotify,
# cliamp, Signal, Obsidian, ChatGPT (T3Chat in ~/.config/hypr/bindings.conf),
# YouTube.
unbind = SUPER SHIFT, M
unbind = SUPER SHIFT ALT, M
unbind = SUPER SHIFT, G
unbind = SUPER SHIFT, O
unbind = SUPER SHIFT, A
unbind = SUPER SHIFT, Y

# App launcher bindings (ALT + key)
source = ~/supplements/webapps-omarchy.conf
